<title>Ашық сабақ · Қазақ тілі · 3 «В» сынып · Түбір мен қосымша</title>

<link rel="stylesheet" href="style.css">
<style>
/* Layout: teacher board — top bar with code and timer; the stage below changes by phase: lobby, question, reveal, leaderboard, final */
#app { min-height: 100vh; display: flex; flex-direction: column; gap: 14px; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); max-width: 1500px; margin: 0 auto; }
.top { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 10px 16px; border-radius: 20px; }
.brand { font-family: var(--display); font-weight: 900; font-size: clamp(18px, 1.8vw, 24px); margin-right: auto; display: flex; align-items: center; gap: 10px; }
.brand b { background: linear-gradient(90deg, #1F7A45, #1661A3, #C0661A); -webkit-background-clip: text; background-clip: text; color: transparent; }
.brand .live { font-size: 12px; font-weight: 900; letter-spacing: 2px; color: #fff; background: linear-gradient(180deg, #FF6A55, #D2452F); padding: 3px 9px; border-radius: 999px; animation: pulse 1.6s ease infinite; }
.codebox { font-family: var(--display); font-weight: 900; font-size: clamp(20px, 2vw, 28px); letter-spacing: 6px; }

/* lobby */
.lobby { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: 14px; align-items: start; }
@media (max-width: 980px) { .lobby { grid-template-columns: minmax(0, 1fr); } }
.joincard { padding: 22px; display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center; }
.joincard .big { font-family: var(--display); font-weight: 900; font-size: clamp(56px, 7vw, 110px); letter-spacing: 10px; line-height: 1; background: linear-gradient(180deg, #F7B24A, #E07A1F); -webkit-background-clip: text; background-clip: text; color: transparent; }
/* әдемі QR: жарқыраған жиек, бұрыштар, сканер сызығы, ортасында жапырақ */
.qrfx { --qs: 200px; position: relative; padding: 7px; border-radius: 28px; isolation: isolate; overflow: hidden; box-shadow: 0 22px 44px -22px rgba(20,90,60,.65); }
.qrfx::before { content: ""; position: absolute; inset: -60%; z-index: -1; background: conic-gradient(from 0deg, #43B36B, #3FA4E8, #F7B24A, #F27C6B, #43B36B); animation: spin 6s linear infinite; }
.qrin { position: relative; background: #fff; border-radius: 22px; padding: 16px; }
.qrc img, .qrc canvas { display: block; width: var(--qs) !important; height: var(--qs) !important; image-rendering: pixelated; }
.qrin .cn { position: absolute; width: 26px; height: 26px; border: 4px solid #1F8A55; }
.qrin .c1 { top: 6px; left: 6px; border-right: 0; border-bottom: 0; border-radius: 10px 0 0 0; }
.qrin .c2 { top: 6px; right: 6px; border-left: 0; border-bottom: 0; border-radius: 0 10px 0 0; }
.qrin .c3 { bottom: 6px; left: 6px; border-right: 0; border-top: 0; border-radius: 0 0 0 10px; }
.qrin .c4 { bottom: 6px; right: 6px; border-left: 0; border-top: 0; border-radius: 0 0 10px 0; }
.qrin .scan { position: absolute; left: 12px; right: 12px; top: 16px; height: 3px; border-radius: 3px; background: linear-gradient(90deg, transparent, #43C47A, transparent); box-shadow: 0 0 14px 3px rgba(67,196,122,.55); animation: scan 2.6s ease-in-out infinite alternate; }
.qrin .logo { position: absolute; left: 50%; top: 50%; width: calc(var(--qs) * .22); height: calc(var(--qs) * .22); transform: translate(-50%, -50%); border-radius: 22%; background: linear-gradient(180deg, #5FCB8B, #1F8A55); display: grid; place-items: center; border: 4px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,.2); }
.qrin .logo svg { width: 62%; height: 62%; }
.qrcap { margin-top: 8px; font-weight: 900; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: #fff; text-align: center; text-shadow: 0 1px 2px rgba(0,0,0,.3); }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes scan { from { top: 16px; } to { top: calc(100% - 19px); } }
#qr .qrfx { --qs: clamp(170px, 16vw, 240px); }
.url { font-weight: 800; font-size: clamp(14px, 1.2vw, 18px); word-break: break-all; }
.teams3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .teams3 { grid-template-columns: minmax(0, 1fr); } }
.tcol { border-radius: 22px; overflow: hidden; display: flex; flex-direction: column; min-height: 220px; }
.tcol .head { position: relative; padding: 14px 16px; color: #fff; display: flex; justify-content: space-between; align-items: center; gap: 8px; overflow: hidden; }
.tcol .head::after { content: ""; position: absolute; inset: 0 0 50% 0; background: linear-gradient(180deg, rgba(255,255,255,.4), rgba(255,255,255,0)); }
.tcol .head h3 { font-size: clamp(17px, 1.6vw, 22px); position: relative; z-index: 1; }
.tcol .head span { font-family: var(--display); font-weight: 900; font-size: clamp(22px, 2.2vw, 30px); position: relative; z-index: 1; }
.tcol .head img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .28; mix-blend-mode: luminosity; }
.tcol .body { padding: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; flex: 1; background: rgba(255,255,255,.72); }

/* question */
.qhead { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 18px; align-items: center; padding: 18px 22px; }
.qn { font-family: var(--display); font-weight: 900; color: #fff; border-radius: 18px; padding: 12px 16px; text-align: center; background: linear-gradient(180deg, #2C5A50, #142B26); box-shadow: 0 1px 0 rgba(255,255,255,.3) inset; font-size: clamp(18px, 1.6vw, 24px); line-height: 1; }
.qn small { display: block; font-size: .55em; opacity: .75; margin-top: 4px; font-weight: 700; }
.qt h2 { font-size: clamp(24px, 2.8vw, 44px); }
.qt .hint { font-weight: 700; color: var(--muted); margin-top: 6px; font-size: clamp(14px, 1.2vw, 18px); }
.ring { position: relative; width: clamp(96px, 9vw, 140px); aspect-ratio: 1; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); filter: drop-shadow(0 6px 10px rgba(224,122,31,.35)); }
.ring .n { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-weight: 900; font-size: clamp(30px, 3vw, 48px); font-variant-numeric: tabular-nums; }
.ring.low .n { color: var(--bad); animation: pulse .8s ease infinite; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.opt { position: relative; border-radius: 20px; padding: clamp(14px, 1.6vw, 22px) 18px; font-weight: 800; font-size: clamp(18px, 1.8vw, 28px); color: #fff; display: flex; gap: 14px; align-items: center; overflow: hidden; box-shadow: 0 1px 0 rgba(255,255,255,.45) inset, 0 12px 24px -14px rgba(0,0,0,.55); }
.opt::after { content: ""; position: absolute; inset: 0 0 52% 0; background: linear-gradient(180deg, rgba(255,255,255,.38), rgba(255,255,255,.02)); }
.opt b { font-family: var(--display); font-size: 1.3em; width: 1.6em; height: 1.6em; border-radius: 12px; display: grid; place-items: center; background: rgba(255,255,255,.25); flex: none; position: relative; z-index: 1; }
.opt span { position: relative; z-index: 1; }
.o0 { background: linear-gradient(180deg, #F27C6B, #C8432F); } .o1 { background: linear-gradient(180deg, #5BB1F0, #1E6DB0); } .o2 { background: linear-gradient(180deg, #F6BE4F, #D08A12); } .o3 { background: linear-gradient(180deg, #5FCB8B, #1F8A55); }
.opt.img { padding: 8px; flex-direction: column; align-items: stretch; }
.opt.img img { width: 100%; aspect-ratio: 16 / 8; object-fit: cover; border-radius: 14px; position: relative; z-index: 1; }
.opt.img b { position: absolute; top: 14px; left: 14px; z-index: 2; }
.optlist { display: grid; gap: 10px; }
.optlist .opt { font-size: clamp(16px, 1.6vw, 24px); }
.numbox { padding: 20px; text-align: center; font-family: var(--display); font-weight: 900; font-size: clamp(26px, 3vw, 46px); }
.answered { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .answered { grid-template-columns: minmax(0, 1fr); } }
.acard { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.acard .h { display: flex; justify-content: space-between; align-items: center; font-weight: 800; }
.acard .h { gap: 8px; }
.acard .h b { font-family: var(--display); font-size: clamp(20px, 2vw, 28px); font-variant-numeric: tabular-nums; white-space: nowrap; }
.reveal .answered { grid-template-columns: minmax(0, 1fr); }
.correct h2.long { font-size: clamp(17px, 1.6vw, 24px); }
.track { height: 14px; border-radius: 999px; background: rgba(20,43,38,.08); overflow: hidden; }
.track i { display: block; height: 100%; border-radius: 999px; transition: width .5s cubic-bezier(.2,.9,.3,1); position: relative; overflow: hidden; }
.track i::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); animation: shine 2.2s ease-in-out infinite; }
.dots { display: flex; flex-wrap: wrap; gap: 5px; }
.dots i { font-style: normal; font-size: 12px; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: rgba(20,43,38,.07); color: var(--muted); transition: all .3s ease; }
.dots i.on { color: #fff; }
.ctrl { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }

/* reveal */
.reveal { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 14px; }
@media (max-width: 980px) { .reveal { grid-template-columns: minmax(0, 1fr); } }
.correct { padding: 16px 20px 34px; display: flex; flex-direction: column; gap: 6px; border: 2px solid var(--good) !important; }
.correct h2 { font-size: clamp(22px, 2.4vw, 36px); color: var(--good); }
.dist { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.drow { display: grid; grid-template-columns: minmax(0, 1fr) 54px; gap: 10px; align-items: center; font-weight: 800; }
.drow .lbl { font-size: clamp(14px, 1.2vw, 18px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drow .bar { height: 30px; border-radius: 10px; position: relative; overflow: hidden; transition: width 1s cubic-bezier(.2,.9,.3,1); width: 0; }
.drow .bar::after { content: ""; position: absolute; inset: 0 0 50% 0; background: linear-gradient(180deg, rgba(255,255,255,.45), rgba(255,255,255,0)); }
.drow b { font-family: var(--display); font-size: 20px; text-align: right; font-variant-numeric: tabular-nums; }
.fast { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.frow { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: clamp(16px, 1.4vw, 20px); animation: rise .5s ease both; }
.medal { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 900; color: #fff; flex: none; box-shadow: 0 1px 0 rgba(255,255,255,.6) inset; }
.m1 { background: linear-gradient(180deg, #FFD86B, #D9A21B); } .m2 { background: linear-gradient(180deg, #E4E9EE, #9AA6B2); } .m3 { background: linear-gradient(180deg, #F1B98A, #B8733D); }

/* leaderboard */
.lb { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 14px; }
@media (max-width: 980px) { .lb { grid-template-columns: minmax(0, 1fr); } }
.lbcard { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.tbar { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-weight: 800; animation: rise .5s ease both; }
.tbar .tr { grid-column: 2 / -1; height: 34px; border-radius: 12px; background: rgba(20,43,38,.07); overflow: hidden; }
.tbar .tr i { display: block; height: 100%; width: 0; border-radius: 12px; transition: width 1.2s cubic-bezier(.2,.9,.3,1); position: relative; overflow: hidden; }
.tbar .tr i::after { content: ""; position: absolute; inset: 0 0 50% 0; background: linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,0)); }
.tbar .nm { font-size: clamp(16px, 1.5vw, 22px); }
.tbar .sc { font-family: var(--display); font-size: clamp(18px, 1.7vw, 24px); font-variant-numeric: tabular-nums; }
.tbl { width: 100%; border-collapse: collapse; font-size: clamp(14px, 1.15vw, 17px); }
.tbl th, .tbl td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl th { font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }

.tbl tr { animation: rise .45s ease both; }
.tbl .rk { font-family: var(--display); font-weight: 900; }
.scroll { overflow-x: auto; }
.lvl { font-weight: 800; padding: 3px 10px; border-radius: 999px; font-size: .9em; }
.lvl.hi { background: var(--good-bg); color: #13603A; } .lvl.mid { background: #FFF1D6; color: #8A5300; } .lvl.low { background: var(--bad-bg); color: #8A2414; }
.dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }

/* podium */
.podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: end; max-width: 900px; width: 100%; margin: 0 auto; }
.step { border-radius: 22px 22px 6px 6px; color: #fff; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 8px; text-align: center; position: relative; overflow: hidden; animation: grow .9s cubic-bezier(.2,.9,.3,1.1) both; transform-origin: bottom; box-shadow: 0 1px 0 rgba(255,255,255,.5) inset, 0 20px 30px -20px rgba(0,0,0,.6); }
.step::after { content: ""; position: absolute; inset: 0 0 60% 0; background: linear-gradient(180deg, rgba(255,255,255,.45), rgba(255,255,255,0)); }
.step .pl { font-family: var(--display); font-weight: 900; font-size: clamp(40px, 4.5vw, 70px); line-height: 1; position: relative; z-index: 1; }
.step .wh { font-family: var(--display); font-weight: 800; font-size: clamp(16px, 1.6vw, 24px); position: relative; z-index: 1; }
.step .pt { font-weight: 800; position: relative; z-index: 1; }
.fb { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.fb div { padding: 12px; text-align: center; font-weight: 800; border-radius: 16px; }
.fb b { display: block; font-family: var(--display); font-size: 30px; }
.cmts { display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow: auto; }
.cmts p { background: rgba(255,255,255,.85); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; font-weight: 600; }

/* анимациялар */
.qbody { position: relative; }
.qbody .opts, .qbody .optlist, .qbody .numbox { filter: blur(8px); opacity: .35; transition: filter .5s ease, opacity .5s ease; }
.qbody.live .opts, .qbody.live .optlist, .qbody.live .numbox { filter: none; opacity: 1; }
.qbody.live .opt { animation: optin .55s cubic-bezier(.2,.9,.3,1.25) both; }
.qbody.live .opt:nth-child(2) { animation-delay: .08s; } .qbody.live .opt:nth-child(3) { animation-delay: .16s; } .qbody.live .opt:nth-child(4) { animation-delay: .24s; }
.getready { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; z-index: 3; transition: opacity .4s ease; }
.getready.gone { opacity: 0; pointer-events: none; }
.getready p { font-family: var(--display); font-weight: 900; font-size: clamp(22px, 2.4vw, 36px); color: var(--ink); }
.getready b { display: grid; place-items: center; width: clamp(110px, 11vw, 170px); aspect-ratio: 1; border-radius: 50%; font-family: var(--display); font-weight: 900; font-size: clamp(64px, 7vw, 110px); color: #fff; background: linear-gradient(180deg, var(--amber2), var(--amber)); box-shadow: 0 0 0 12px rgba(247,178,74,.25), 0 24px 40px -18px rgba(224,122,31,.9); animation: pop .6s cubic-bezier(.2,.9,.3,1.4) both; }
.flash { position: fixed; inset: 0; z-index: 35; display: grid; place-items: center; pointer-events: none; background: radial-gradient(circle, rgba(255,255,255,.6), rgba(255,255,255,0) 70%); }
.flash b { font-family: var(--display); font-weight: 900; font-size: clamp(40px, 6vw, 96px); padding: 18px 36px; border-radius: 30px; color: #fff; animation: flashin .9s cubic-bezier(.2,.9,.3,1.3) both; box-shadow: 0 30px 60px -20px rgba(0,0,0,.45); }
.flash.all b { background: linear-gradient(180deg, #5FCB8B, #1F8A55); }
.flash.time b { background: linear-gradient(180deg, #FF8A75, #D2452F); }
@keyframes flashin { 0% { transform: scale(.3) rotate(-6deg); opacity: 0; } 60% { transform: scale(1.08) rotate(1deg); opacity: 1; } 100% { transform: scale(1); } }
@keyframes optin { from { opacity: 0; transform: translateY(22px) scale(.94); } to { opacity: 1; transform: none; } }
.qhead { animation: rise .5s ease both; }
.qt h2 { animation: textin .7s cubic-bezier(.2,.9,.3,1) both; }
@keyframes textin { from { opacity: 0; transform: translateY(12px); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
.slide > *, .lb > *, .reveal > *, .cols3 > *, .kz > *, .g7 > *, .side3 > *, .counters > * { animation: rise .6s cubic-bezier(.2,.9,.3,1) both; }
.slide > *:nth-child(2), .lb > *:nth-child(2), .reveal > *:nth-child(2), .cols3 > *:nth-child(2), .kz > *:nth-child(2), .g7 > *:nth-child(2), .side3 > *:nth-child(2), .counters > *:nth-child(2) { animation-delay: .12s; }
.slide > *:nth-child(3), .cols3 > *:nth-child(3), .kz > *:nth-child(3), .g7 > *:nth-child(3), .side3 > *:nth-child(3), .counters > *:nth-child(3) { animation-delay: .24s; }
.g7 > *:nth-child(4) { animation-delay: .32s; } .g7 > *:nth-child(5) { animation-delay: .4s; } .g7 > *:nth-child(6) { animation-delay: .48s; } .g7 > *:nth-child(7) { animation-delay: .56s; } .g7 > *:nth-child(8) { animation-delay: .64s; }
.boxp li { animation: rise .5s ease both; } .boxp li:nth-child(2) { animation-delay: .15s; } .boxp li:nth-child(3) { animation-delay: .3s; } .boxp li:nth-child(4) { animation-delay: .45s; }
.correct { animation: pop .6s cubic-bezier(.2,.9,.3,1.3) both !important; }
.shead h1 { animation: textin .8s cubic-bezier(.2,.9,.3,1) both; }
/* оқулық сілтемесі: кішкене бұрыш белгісі */
.pg { position: absolute; z-index: 2; right: 12px; bottom: 10px; font-size: 12px; font-weight: 800; letter-spacing: .3px; color: var(--muted); background: rgba(255,255,255,.88); border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; }
.shead .pg { top: 10px; bottom: auto; }
.qhead { position: relative; padding-bottom: 30px; }
/* QR әрқашан қолжетімді */
.qrbtn { position: fixed; right: 14px; bottom: 96px; z-index: 21; display: flex; align-items: center; gap: 8px; }
.qrov { position: fixed; inset: 0; z-index: 40; background: rgba(244,248,242,.92); backdrop-filter: blur(6px); display: grid; place-items: center; padding: 16px; }
.qrov #qrbig .qrfx { --qs: min(40vh, 320px); }
.qrov .glass { padding: 26px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; max-width: 520px; }
.qrov .big { font-family: var(--display); font-weight: 900; font-size: clamp(48px, 7vw, 96px); letter-spacing: 10px; line-height: 1; color: var(--amber); }
.jsteps { display: grid; gap: 8px; width: 100%; text-align: left; }
.jsteps p { display: flex; gap: 10px; align-items: center; font-weight: 800; font-size: clamp(15px, 1.3vw, 19px); }
.jsteps b { flex: none; width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; color: #fff; background: linear-gradient(180deg, var(--amber2), var(--amber)); font-family: var(--display); }
.teamchip[data-u] { cursor: pointer; border: none; font: inherit; font-weight: 800; font-size: 15px; }

/* 45 минуттық сабақ: уақыт жолағы, кезеңдер, слайдтар */
#app { padding-bottom: 96px; }
body.fitmode #app { padding-bottom: 6px; min-height: 0; max-width: none; box-sizing: border-box; }
.fsbtn { flex: none; border: none; background: transparent; font-size: 20px; font-weight: 900; cursor: pointer; padding: 4px 8px; border-radius: 10px; color: var(--ink); }
body.fitmode { overflow-x: hidden; }
.lbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 14px; border-radius: 18px; font-weight: 800; }
.cdown { display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 6px; border-radius: 18px; background: linear-gradient(180deg, #F2FBF5, #E2F4E8); border: 1px solid #BFE3CC; }
.cdown svg { width: 54px; height: 54px; flex: none; }
.cdown small { display: block; font-size: 11px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; color: #2E7A4E; }

(function () {

  /* ---------- 45 минуттық сабақтың кезеңдері ---------- */

    const m = game.meta || {};
    if (m.host === be.uid || be.demo) assignTeams();
    /* Тақта режимі: әр топ тақтада жауап береді (планшетсіз). Топтар виртуалды «оқушы» ретінде есептеледі */
    { const tn = m.teamNames || teamNames, ta = m.tans || {};
      game.players = Object.assign({}, game.players); game.teams = Object.assign({}, game.teams); game.answers = Object.assign({}, game.answers);
      [0, 1, 2].forEach((t) => { game.players['team' + t] = { name: (tn[t] || T[t].name) + ' тобы', board: 1 }; game.teams['team' + t] = t; });
      Object.keys(ta).forEach((qi) => { game.answers[qi] = Object.assign({}, game.answers[qi], ta[qi]); });
      const bf = m.bfb || {}; if (Object.keys(bf).length) { game.feedback = Object.assign({}, game.feedback); Object.keys(bf).forEach((k) => { game.feedback['b' + k] = bf[k]; }); } }
    /* ескі/басқа нұсқадан қалған жазба: сұрақ нөмірі жарамсыз болса, сұрақ режимінен шығамыз */
    if ((m.phase === 'question' || m.phase === 'reveal') && !Q[m.q]) { m.phase = 'slide'; m.q = -1; if (m.host === be.uid || be.demo) { try { be.update(G + '/meta', { phase: 'slide', q: -1 }); } catch (e) {} } }
    const key = m.phase + ':' + m.q + ':' + (m.starts && typeof m.starts[m.q] === 'number' ? 1 : 0) + ':' + m.stage;
    if (key !== mounted) {
      mounted = key;
      if (m.phase === 'lobby') mountLobby();
      else if (m.phase === 'question') mountQuestion();
      else if (m.phase === 'reveal') mountReveal();
      else if (m.phase === 'board') mountBoard();
      else if (m.phase === 'end') mountEnd();
      else if (m.phase === 'slide') mountSlide();
      else if (m.phase === 'feedback') mountFeedback();
      else if (m.phase === 'relay') mountRelay();
      chrome();
    } else {
      if (m.phase === 'lobby') updateLobby();
      else if (m.phase === 'question') updateQuestion();
      if (window._wsDraw && $('slist')) window._wsDraw();
      else if (m.phase === 'end') { const f = $('fbk'); if (f) f.innerHTML = feedbackBox(); }
      else if (m.phase === 'feedback') updateFeedback();
      else if (m.phase === 'relay') relayScores();
    }
  });
})();
</script>
</body>
</html>
